# 前端静态站（容器内 80）。/api 不在这里，由入口 nginx 直接反代到 api:8000。
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 镜像自身的健康检查打这里（入口 nginx 的健康检查打它自己的 /healthz，不探本容器）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite 产物文件名带内容 hash，可以放心长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 绝不缓存：缓存住的话发版后用户拿到的还是旧壳，
    # 而旧壳引用的 chunk 已经被新构建删掉了 → 白屏
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /favicon.ico {
        expires 7d;
        access_log off;
    }

    # SPA 路由兜底：任何前端路由刷新都回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
