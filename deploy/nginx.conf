# 前端静态站点 + 后端反向代理（打在 nginx 镜像里，见仓库根目录的 Dockerfile）
#
# ── 为什么是"同源反代"而不是"前端直连 8000" ─────────────────────
# 浏览器只访问一个源：http://<服务器IP>/。页面和 /api 请求同源，于是：
#   1. 后端 cors.py 里那份「只允许 localhost:5173」的白名单**一行都不用改**；
#   2. 前端源码里写死的相对路径 '/api'（src/api/client.js）原样可用，不用加
#      任何 VITE_ 环境变量、不用重新构建；
#   3. 公网只开一个 80 端口，8000/3306 全部留在回环上。
#
# api 这个主机名来自后端 compose 的服务名，两个 compose 接在同一个 docker 网络上
# （网络名见 deploy/docker-compose.yml，由 deploy.sh 用 -p aichat 固定下来）。

# Docker 用户自定义网络里的内置 DNS。
# 配合下面 proxy_pass 里的 $api_upstream 变量使用：
#   nginx 若直接写 proxy_pass http://api:8000，只在**启动时**解析一次名字并永久缓存，
#   api 容器重建换了 IP 之后就会持续 502，直到有人重启 nginx —— 变量 + resolver
#   让 nginx 按 valid=10s 重新解析，避免这个"重启一下就好了"的经典坑。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 后端单文件上限 50MB（前端也会先拦一道），留点富余给 multipart 边界。
    # 不设的话 nginx 默认 1m，上传直接 413，而且错误信息看不出是 nginx 拦的。
    client_max_body_size 64m;
    client_body_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── 静态产物 ────────────────────────────────────────────
    # Vite 产物文件名带内容 hash，可以放心长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 绝不缓存：缓存住的话发版后用户拿到的还是旧壳，
    # 而旧壳引用的 chunk 已经被新构建删掉了 → 白屏。
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA 路由兜底：任何前端路由刷新都回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 后端接口 ────────────────────────────────────────────
    location /api/ {
        set $api_upstream http://api:8000;
        # 用了变量，nginx 就不会自己拼 URI，必须显式带 $request_uri（含查询串）
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 这里刻意用 $remote_addr **覆盖**而不是 $proxy_add_x_forwarded_for 追加：
        # 追加会把客户端自带的 X-Forwarded-For 原样带给后端，等于让调用方自己决定
        # "我被记成哪个 IP"。后端 TRUST_PROXY_HEADERS=1 时会采信这个头，
        # 所以只有我们这一层受控代理写进去的值才是可信的。
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # SSE —— POST /api/chat/stream。
        # 不关缓冲的话 token 会被 nginx 攒到最后一次性吐出来：前端「正在检索知识库…」
        # 和逐字效果全没了，看起来像卡死然后突然整段出现。
        proxy_buffering off;
        proxy_cache off;

        # 上传接口会同步跑完「解析 → 切块 → embedding → 入库」，几分钟是正常的，
        # 超时设短了会在文件已经入库的情况下给前端一个 504。
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # 大文件直接透传给后端，不在 nginx 落盘
        proxy_request_buffering off;
    }

    # ── 探针与接口文档 ──────────────────────────────────────
    # 侧边栏「接口文档」指向 /docs，所以要放行 /docs 和它依赖的 /openapi.json。
    # /metrics 故意**不**反代：公网 IP 下指标里含业务信息，要看就 ssh 上去
    # curl http://127.0.0.1:8000/metrics（后端 8000 只绑回环）。
    location = /health {
        access_log off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
    }

    location = /ready {
        access_log off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
    }

    location /docs {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
    }

    location = /openapi.json {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
    }

    # ── 可选：整站 HTTP Basic 兜底 ──────────────────────────
    # 后端 AUTH_ENABLED=0 时，接口对公网是敞开的：任何人都能用你的 LLM key 提问、
    # 往知识库传文档。在还没有前端登录页之前，先用这一层挡住扫描器。
    # 启用步骤见 DEPLOY.md「安全加固」：deploy/.htpasswd 由 compose 挂进来。
    #
    # auth_basic           "AI Chat";
    # auth_basic_user_file /etc/nginx/.htpasswd;
}
